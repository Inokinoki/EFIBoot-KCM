<busconfig>
  <policy user="root">
    <allow own="org.kde.kcm.efiboot.helper"/>
    <allow send_destination="org.kde.kcm.efiboot.helper"/>
    <allow receive_sender="org.kde.kcm.efiboot.helper"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.kde.kcm.efiboot.helper"/>
    <allow receive_sender="org.kde.kcm.efiboot.helper"/>
  </policy>
</busconfig>
