name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  fedora:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
    - name: Install dependencies
      run: |
        dnf install -y \
          cmake \
          extra-cmake-modules \
          qt6-qtbase-devel \
          qt6-qtdeclarative-devel \
          kf6-kcoreaddons-devel \
          kf6-ki18n-devel \
          kf6-kcmutils-devel \
          kf6-kauth-devel \
          qt6-qttools-devel \
          gcc-c++ \
          efivar-devel \
          git

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_INSTALL_PREFIX=/usr \
          -DBUILD_TESTING=ON

    - name: Build
      run: |
        cd build
        make -j$(nproc)

    - name: Install
      run: |
        cd build
        make install DESTDIR=$PWD/install

  arch-linux:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
    - name: Install dependencies
      run: |
        # Update system and install dependencies in one go
        pacman --noconfirm -Syu
        # Install required dependencies
        pacman --noconfirm -S --needed \
          base-devel \
          cmake \
          extra-cmake-modules \
          qt6-base \
          qt6-declarative \
          qt6-tools \
          kf6-kcoreaddons \
          kf6-ki18n \
          kf6-kcmutils \
          kf6-kauth \
          efivar \
          git

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_INSTALL_PREFIX=/usr \
          -DBUILD_TESTING=ON

    - name: Build
      run: |
        cd build
        make -j$(nproc)

    - name: Install
      run: |
        cd build
        make install DESTDIR=$PWD/install
